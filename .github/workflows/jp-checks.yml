name: JP checks
on:
  push:
    branches: [JP]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streetwise-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: streetwise-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
